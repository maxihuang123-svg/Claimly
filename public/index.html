<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claimly</title>
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/calls.css">
</head>
<body>
  <!--
    Claimly: claims review.
    THESIS: One table. Clicking a row opens recommendation, reason, evidence and action in place. The full trace waits behind Show details.
    SCENE: A claims handler at a desktop in daylight, working through rows with a mouse.
    COLOR: Neutrals. Color marks the three outcomes, nothing else.
    TYPE: System sans throughout. Tabular numerals. Mono only for case IDs.
    SHELL: The sidebar lists pages. Add a page by adding one entry to PAGES in app.js.
  -->
  <aside class="sidebar">
    <div class="brand"><img class="brand-mark" src="/logo.png" alt="" aria-hidden="true"><span class="brand-name">Claimly</span></div>
    <nav aria-label="Pages"><ul class="nav" id="nav"></ul></nav>
  </aside>
  <div class="panel"><main class="page" id="page"></main></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
